// TerminationService（05 §5.4）[frozen]
// 硬约束：RequestTermination 是全系统唯一的会话终止入口（除熔断外）。
// 任何直接 return / raise SystemExit / 关闭 session 的路径都是 P0 缺陷（09 §R6）。
service TerminationService {
