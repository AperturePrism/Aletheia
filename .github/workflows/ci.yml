# Aletheia CI —— 实现 docs/04 §6 的 Q1–Q14 门禁。
#
# 设计原则（docs/10 §8「把检查固化为 CI —— 终极方案」）：
#   本文件的长期目标是让自己变得不必要 —— 检查项一旦写进 CI 门禁，
#   就无法自欺。docs/10 §8 的判断标准：
#      如果一个检查项连续两个迭代都靠人工完成，它就应该被写成 CI 门禁。
#
# 因此本文件把 I0 能自动化的门禁全部固化。当前不能自动化的
# （Q3/Q4/Q5 需要真实靶场、Q8 需要 24h）明确标注为"待对应迭代补齐"，
# 而不是留一个假装通过的占位。
#
# 工具链统一由 .github/actions/setup 提供 —— 不要在 job 里手写 setup 步骤。
# 历史教训（CI 首跑 + 二跑共三次失败）：
#   · 某 job 漏装 web/ 前端依赖 → eslint: not found + 大量 TS2307
#   · 某 job 完全没有 setup 步骤 → uv: command not found
#   · curl 装 uv 会装到 ~/.local/bin，不在 runner 的 PATH 里
# 集中 setup 让"漏一步"不可能发生。
#
# Q3/Q4/Q5 是三条红线（docs/04 §6）：任何一条失败，无论功能多重要，
# 一律不得合并。它们目前没有 CI 覆盖 —— 这是 I0 的已知缺口，
# 在 I2（Q3）/ I3（Q4、Q5）补齐。在此之前的合并依赖 make redline。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发（用来验证 CI 本身是否还活着）
  workflow_dispatch:

# 同一分支的新推送取消旧任务，省算力。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ==========================================================================
  # Job 1: 构建与测试（Q1）
  # ==========================================================================
  build-and-test:
    name: build & test (Q1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          with-uv: "true"

      - name: Install dependencies
        run: make env

      # Q1：全部单元测试。Ubuntu 上有 gcc，因此 race 检测可启用 ——
      # 本地 Windows 无 C 编译器时 GO_TEST_RACE 默认 0（见 Makefile 说明）。
      - name: Unit tests (Q1)
        run: GO_TEST_RACE=1 make test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            **/*.log
            .coverage
          retention-days: 7

  # ==========================================================================
  # Job 2: 契约一致性（Q10 / Q14）
  # ==========================================================================
  contract:
    name: contract (Q10/Q14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          with-uv: "true"

      - name: Install dependencies
        run: make env

      # Q14：生成物与契约一致。
      # 这一项是 R1（docs/09：不得擅自修改 05 契约）的自动化防线 ——
      # 有人改了 proto 没重新生成，或手改了生成物，都在这里被拦下。
      - name: Generated code is fresh (Q14)
        run: make check-gen-fresh

      # Q10：Go / Python / TypeScript 三侧生成物与 docs/05 一致。
      - name: Contract consistency (Q10)
        run: make test-contract

  # ==========================================================================
  # Job 3: Lint（Q7）
  # ==========================================================================
  lint:
    name: lint (Q7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          with-uv: "true"

      - name: Install dependencies
        run: make env

      - name: Lint (Q7)
        run: make lint

  # ==========================================================================
  # Job 4: 安全静态检查（docs/10 §3 P2/P3 自动化）
  # ==========================================================================
  security-static:
    name: security static checks
    runs-on: ubuntu-latest
    steps:
      # 这个 job 首跑时漏了全部 setup 步骤（含 uv），第二次跑才暴露。
      # 现在统一走 composite action，不会再漏。
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          with-uv: "true"

      - name: No-bypass scan (docs/10 §3 P3)
        run: bash scripts/check-no-bypass.sh

      # 变异验证：注入已知违规，确认扫描脚本真的报 FAIL 并退出非零。
      # 缺这一条，一个永真的扫描脚本会让所有"门禁已通过"的结论失去依据
      # （docs/10 §0「绿灯替代有效」）。
      - name: Mutation-verify the scanner
        run: make test-python PYTEST_ARGS="tests/test_security_scan.py -q"

      - name: Frontend credential check (Q12)
        run: bash scripts/check-frontend-credentials.sh

      - name: Loopback default (Q13)
        run: make check-loopback

      # docs/09 §10 第 9、10 项：交接文档与自检报告。
      # 检查 04 中已回填的迭代是否两份文档齐全 —— 缺一份即阻断。
      # 交付物缺失（docs/10 §3 P10）最常见的遗漏正是它们，
      # 而"下次补"的承诺通常不会兑现。
      - name: Iteration deliverables (docs/09 §10)
        run: bash scripts/check-iteration-docs.sh --all

      # docs/11 §5 裁决护栏（项目负责人 2026-09-24 确认 C + D）：
      # 治理模型按 08/09 执行，不接受按指令文档放宽。
      # 该裁决目前只有文档记录，没有代码强制 —— 本步骤把它可验证的部分固化。
      - name: Governance guard (docs/11 §5)
        run: bash scripts/check-governance-guard.sh

  # ==========================================================================
  # Job 5: WebUI 嵌入冒烟（Q11）
  # ==========================================================================
  embed-smoke:
    name: WebUI embed smoke (Q11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # make build 自带 web-build → env-web 依赖，会自动装 web/ 的前端依赖。
      # 不在这里手写 npm install —— 首跑就是那么做的，结果漏装 web/ 依赖
      # 导致整个 job 失败。
      - name: Build
        run: make build

      - name: Q11 smoke test
        run: make verify-embed

  # ==========================================================================
  # Job 6: 覆盖率（Q2，I1 起为硬门禁）
  # ==========================================================================
  coverage:
    name: coverage (Q2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          with-uv: "true"

      - name: Install dependencies
        run: make env

      # I0 阶段解析器尚未存在（I1 交付），因此覆盖率门禁暂不阻断。
      # I1 起改为 continue-on-error: false，并确认阈值 90% 生效。
      - name: Coverage (Q2)
        continue-on-error: true
        run: make coverage

# ============================================================================
# 尚未自动化的门禁（docs/04 §6）—— 明确记录，不用假通过掩盖
# ============================================================================
#
# | 门禁 | 内容                             | 补齐迭代 |
# |------|----------------------------------|----------|
# | Q3   | 伪造证据注入 100% 被拒           | I2       |
# | Q4   | 越界 100% fail-closed            | I3       |
# | Q5   | 抓包零真实值泄漏                  | I3       |
# | Q6   | 确定性（字节级一致）              | I1       |
# | Q8   | 24h 长时稳定性                    | I0–I3 期间 |
# | Q9   | 预算耗尽必然熔断                  | I3       |
#
# 在补齐之前，这些门禁靠 `make redline` 在本地/合并前执行。
# 这是 I0 的已知缺口，按 docs/09 §10 第 4 项「偏差说明」要求如实记录。
